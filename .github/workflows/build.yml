name: Build

# UDCalc on macOS and Linux (an AppImage), by gnustep-release-actions'
# workflows, the same as every app's: every push is built, tested (the self-
# test's Arithmetic and Updates scenarios) and uploaded as artifacts; a v*
# tag (or a run started by hand with one) is also released: the Mac app
# signed and notarized with its Sparkle appcast, the AppImage with its
# update information, attached to the tag's release (a pre-release when the
# tag has a '-'). What is UDCalc's own is in .github/release/ (build, test,
# the image's configuration).
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build and release (empty: this branch, as artifacts)'
        required: false
        default: ''

# Pushes only, not pull requests too: a push to a branch of this repository
# already shows its checks on the branch's pull request, and both would run
# every commit twice. A newer push to a branch supersedes the run before it;
# a release is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  macos:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/macos-release.yml@v1
    with:
      tag: ${{ inputs.tag }}
      apps: UDCalc=Calculator
    secrets: inherit

  appimage:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/appimage-release.yml@v1
    with:
      tag: ${{ inputs.tag }}
