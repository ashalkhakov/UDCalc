# UDCalc's Windows installer: what it carries and starts. The installer is
# gnustep-release-actions' msi (the runtime, WinUXTheme), the same as every
# app's; see its msi.sh for each name.
NAME=UDCalc
APPS="Calculator"
DEFAULT=Calculator
ICON=Calculator/Assets.xcassets/AppIcon.appiconset/CalcIcon-256.png
SUMMARY="A clone of the macOS Calculator: basic, scientific and programmer modes, and a paper tape"
# The installed app's own self-test, its arithmetic.
SMOKE="--self-test Arithmetic"
