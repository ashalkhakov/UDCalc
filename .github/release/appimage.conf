# UDCalc's AppImage: what it carries and starts. The image is gnustep-release-actions'
# appimage (the launcher, the runtime, the fonts), the same as every app's;
# see its appimage.sh for each name.
# Not "-Linux": an .AppImage says what it is for (AppImage asks names not to).
IMAGE=UDCalc
NAME=UDCalc
APPS="Calculator"
DEFAULT=Calculator
ENTRIES="Scripts/appimage/udcalc.desktop=Calculator/Assets.xcassets/AppIcon.appiconset/CalcIcon-256.png"
METAINFO=Scripts/appimage/io.github.ashalkhakov.UDCalc.appdata.xml
REQUIRE="Calculator.app/Resources/MainMenu.xib Calculator.app/Resources/UDCalcView.xib Calculator.app/Resources/ConversionWindow.xib Calculator.app/Resources/UDTapeWindow.xib"
